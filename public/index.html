<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>一个云剪贴板</title>
</head>
<body>
  <h1> 云剪贴板</h1>
  <textarea id="clip" rows="10" cols="50" placeholder="在这里输入内容..."></textarea><br>
  <button id="saveBtn">保存到云剪贴板</button>
  <button id="loadBtn">从云剪贴板加载内容</button>
  <p id="status"></p>
  <p>现在时间：<span id="time"></span></p>
  <script type="module">
    import {initializeApp} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import {getFirestore,doc,setDoc,getDoc} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
    const firebaseConfig = {
    apiKey: "AIzaSyDMEgdIWVbwRBmo6mvqFbY4Mjbl5OgHBfs",
    authDomain: "tamfuyin-project.firebaseapp.com",
    projectId: "tamfuyin-project",
    storageBucket: "tamfuyin-project.firebasestorage.app",
    messagingSenderId: "148865347259",
    appId: "1:148865347259:web:8932f739908fa3565c839e",
    measurementId: "G-GLKYCP75EH"
  };
  const app=initializeApp(firebaseConfig);
  const db=getFirestore(app);

  const clip=document.getElementById("clip");

  const status=document.getElementById("status");
  async function saveClipboard() {
    try{
    await setDoc(doc(db,"clipboard","global"),{text:clip.value});
    status.textContent="已保存到云剪贴板";
    } catch(e){
      status.textContent="保存失败："+e;
    }
  }
  async function loadClipboard() {
    const docSnap=await getDoc(doc(db,"clipboard","global"));
    if(docSnap.exists()){
      clip.value=docSnap.data().text;
      status.textContent="已从云剪贴板加载内容";
    } else {
      status.textContent="云剪贴板为空";
    }
  }
  document.getElementById("saveBtn").onclick=saveClipboard;
  document.getElementById("loadBtn").onclick=loadClipboard;
  loadClipboard();
  </script>
  <script>
    async function update() {
      const res = await fetch("/api/time");
      const data = await res.json();
      document.getElementById("time").textContent = data.time;
    }
    setInterval(update, 1000);
    update();
  </script>
</body>
</html>
